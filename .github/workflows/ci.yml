name: ci
on: [push, pull_request]
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - uses: actions/cache@v6
        with:
          path: ~/.claudespeak/models
          key: supertonic-3-aafc6e3
      - run: node bin/claudespeak.mjs install --models-only
      - run: npm test
        env:
          SMOKE_TTS: "1"
